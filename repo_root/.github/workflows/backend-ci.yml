# Runs on every push and pull request that touches the backend.
# Put this file at <repo root>/.github/workflows/backend-ci.yml
# If your backend folder is not called "backend", change BACKEND_DIR below.
name: backend-ci

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

env:
  BACKEND_DIR: backend

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medlife_user
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: medlife
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medlife_user" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789abcdef
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_PASSWORD: ci-password
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ env.BACKEND_DIR }}/requirements/lock.txt
      - name: Install tesseract (OCR tests)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
        working-directory: .
      - name: Install dependencies (pinned)
        run: pip install -r requirements/dev.txt -c requirements/lock.txt
      - name: Migrations are in sync with models
        run: python manage.py makemigrations --check --dry-run
      - name: Django system check
        run: python manage.py check
      - name: Production settings check (check --deploy)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789abcdef-prod-check
          TOTP_ENCRYPTION_KEY: "M3Cg2xEf5JcwqD-t4Ca9xir1pUza7GdE0QSx32_p5_Y="
          REDIS_URL: redis://127.0.0.1:6379/1
          FRONTEND_PASSWORD_RESET_URL: https://example.com/reset-password
          EMAIL_HOST: smtp.example.com
          EMAIL_HOST_USER: ci
          EMAIL_HOST_PASSWORD: ci
          DEFAULT_FROM_EMAIL: no-reply@example.com
          SECURE_HSTS_SECONDS: "31536000"
        run: python manage.py check --deploy
      - name: Tests
        env:
          TOTP_ENCRYPTION_KEY: "M3Cg2xEf5JcwqD-t4Ca9xir1pUza7GdE0QSx32_p5_Y="
        run: python manage.py test
